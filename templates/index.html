<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Reflection AI</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="container">
      <div class="theme-selector">
        <label>Select Theme:</label>

        <select id="themeSelect">
          <option value="default">Default</option>
          <option value="kdrama">K-Drama</option>
          <option value="dark">Dark Academia</option>
          <option value="minimal">Minimal</option>
        </select>
      </div>

      <h1>Student Reflection AI</h1>

      <p class="subtitle">Reflect. Track growth. Prevent burnout.</p>

      <form method="POST">
        <label for="reflection"> Today's Reflection </label>

        <textarea
          id="reflection"
          name="reflection"
          rows="8"
          placeholder="Write about your day..."
        >
        </textarea>

        <label for="mood"> Mood </label>

        <select id="mood" name="mood">
          <option>Happy</option>
          <option>Calm</option>
          <option>Motivated</option>
          <option>Stressed</option>
          <option>Tired</option>
          <option>Sad</option>
        </select>

        <label for="productivity"> Productivity Rating </label>

        <select id="productivity" name="productivity">
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
        </select>

        <button type="submit">Save Reflection</button>

        {% if sentiment %}

        <div class="result-box">
          <h3>{{ sentiment }}</h3>
        </div>

        {% endif %}

        <br /><br />
        <a href="/history">View Reflection History</a>
      </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
